[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ionospheric-simclr"
version = "0.1.0"
description = "Self-supervised representation learning for SuperDARN radar observations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "h5py>=3.10,<4", "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2", "tqdm>=4.66,<5", "torch>=2.2,<3"
]

[tool.setuptools.packages.find]
where = ["src"]
